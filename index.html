    <script>
        // 在 DOMContentLoaded 事件中處理圖片
        document.addEventListener('DOMContentLoaded', async function () {
            const slider = document.getElementById('slideSlider');
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');
            let currentSlide = 0;
            let startX;
            let isDragging = false;

            function nextSlide() {
                slides[currentSlide].classList.remove('active');
                dots[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
                dots[currentSlide].classList.add('active');
                updateDots();
            }

            function prevSlide() {
                slides[currentSlide].classList.remove('active');
                dots[currentSlide].classList.remove('active');
                currentSlide = (currentSlide - 1 + slides.length) % slides.length;
                slides[currentSlide].classList.add('active');
                dots[currentSlide].classList.add('active');
                updateDots();
            }

            function updateDots() {
                dots.forEach((dot, index) => dot.toggleAttribute('aria-current', index === currentSlide));
            }

            // 修改滑鼠事件處理函數
            function handleStart(event) {
                isDragging = true;
                startX = event.type === 'mousedown' ? event.clientX : event.touches[0].clientX;
                if (event.type === 'mousedown') {
                    event.preventDefault(); // 只在滑鼠事件時阻止默認行為
                }
            }

            function handleMove(event) {
                if (!isDragging) return;

                const currentX = event.type === 'mousemove' ? event.clientX : event.touches[0].clientX;
                const diff = currentX - startX;

                if (Math.abs(diff) > 5) {
                    slider.style.cursor = 'grabbing';
                }

                // 只在水平滑動超過閾值時阻止默認行為
                if (event.type === 'touchmove' && Math.abs(diff) > 10) {
                    event.preventDefault();
                }
            }

            function handleEnd(event) {
                if (!isDragging) return;

                const endX = event.type === 'mouseup' ? event.clientX :
                    (event.changedTouches ? event.changedTouches[0].clientX : startX);
                const diff = endX - startX;

                if (Math.abs(diff) > 50) {
                    if (diff > 0) {
                        prevSlide();
                    } else {
                        nextSlide();
                    }
                }

                isDragging = false;
                slider.style.cursor = 'grab';
            }

            // 修改事件監聽器
            slider.addEventListener('mousedown', handleStart);
            slider.addEventListener('touchstart', handleStart);

            window.addEventListener('mousemove', handleMove);
            slider.addEventListener('touchmove', handleMove, { passive: false });

            window.addEventListener('mouseup', handleEnd);
            slider.addEventListener('touchend', handleEnd);

            // 當滑鼠離開視窗時，結束拖曳狀態
            window.addEventListener('mouseleave', () => {
                isDragging = false;
                slider.style.cursor = 'grab';
            });

            // 自動輪播時間改為 5000 毫秒（5秒）
            let autoPlayInterval = setInterval(nextSlide, 5000);

            // 當使用者互動時暫停自動輪播
            slider.addEventListener('mouseenter', () => {
                clearInterval(autoPlayInterval);
            });

            // 當使用者離開時恢復自動輪播
            slider.addEventListener('mouseleave', () => {
                autoPlayInterval = setInterval(nextSlide, 5000); // 這裡也改為 5000
            });

            // 點擊指示點切換圖片
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    slides[currentSlide].classList.remove('active');
                    dots[currentSlide].classList.remove('active');
                    currentSlide = index;
                    slides[currentSlide].classList.add('active');
                    dots[currentSlide].classList.add('active');
                    updateDots();
                });
            });

            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                clearInterval(autoPlayInterval);
            }
        });
    </script>
